<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullShot Editor</title>
    <link rel="stylesheet" href="editor.css">
    <!-- Google Fonts for premium feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Toolbar -->
        <aside id="toolbar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4h16v16H4V4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 12h16M12 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="tools-group">
                <button class="tool-btn active" data-tool="select" data-tooltip="Seleccionar (V)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                </button>
                <button class="tool-btn" data-tool="crop" data-tooltip="Recortar (C)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.13 1L6 16a2 2 0 002 2h15"/><path d="M1 6.13L16 6a2 2 0 012 2v15"/></svg>
                </button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="pen" data-tooltip="Lápiz libre (P)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                </button>
                <button class="tool-btn" data-tool="arrow" data-tooltip="Flecha (A)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
                <button class="tool-btn" data-tool="rect" data-tooltip="Rectángulo (R)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
                </button>
                <button class="tool-btn" data-tool="circle" data-tooltip="Círculo / Elipse (O)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
                </button>
                <button class="tool-btn" data-tool="text" data-tooltip="Texto (T)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                </button>
                <div class="divider"></div>
                <button class="tool-btn" data-tool="highlight" data-tooltip="Resaltador (H)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.24 12.24a6 6 0 00-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="6.5"/></svg>
                </button>
                <button class="tool-btn" data-tool="blur" data-tooltip="Censurar área (B)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8" stroke-dasharray="2 2"/></svg>
                </button>
                <div class="divider"></div>
                <button class="tool-btn" id="btn-undo" data-tooltip="Deshacer (Ctrl+Z)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
                </button>
                <button class="tool-btn" id="btn-redo" data-tooltip="Rehacer (Ctrl+Shift+Z)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/></svg>
                </button>
                <button class="tool-btn" id="btn-delete" data-tooltip="Eliminar seleccionado (Supr)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                </button>
            </div>
            
            <div class="color-picker-container">
                <input type="color" id="color-picker" value="#ff0000" title="Color">
            </div>
        </aside>

        <!-- Main Workspace -->
        <main id="workspace">
            <div id="canvas-container">
                <canvas id="c"></canvas>
            </div>
            
            <!-- Floating Top Bar -->
            <header id="top-bar">
                <div class="zoom-controls">
                    <button id="zoom-out" title="Alejar">-</button>
                    <span id="zoom-level">100%</span>
                    <button id="zoom-in" title="Acercar">+</button>
                    <button id="zoom-fit" title="Ajustar a pantalla">Ajustar</button>
                </div>
                <div class="actions">
                    <button id="btn-new" class="btn btn-secondary">Nueva captura</button>
                    <button id="btn-export" class="btn btn-primary">Exportar</button>
                </div>
            </header>
            
            <!-- Export Modal -->
            <div id="export-modal" class="modal hidden">
                <div class="modal-content">
                    <h3>Exportar imagen</h3>
                    <div class="export-options">
                        <button id="btn-dl-png" class="btn btn-block">Descargar PNG (alta calidad)</button>
                        <button id="btn-dl-jpeg" class="btn btn-block">Descargar JPEG (menor tamaño)</button>
                        <button id="btn-copy" class="btn btn-block btn-secondary">Copiar al portapapeles</button>
                    </div>
                    <button id="btn-close-modal" class="btn btn-text">Cancelar</button>
                </div>
            </div>
        </main>
    </div>
    <!-- Load Fabric.js from module / local dependencies via esbuild -->
    <script src="editor.js"></script>
</body>
</html>
